name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet -tags e2e ./...
      - run: go test ./...
      # e2e boots s3mock and Dex via testcontainers on the runner's Docker.
      - run: go test -tags e2e ./e2e/

  release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tag builds create a GitHub Release
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }} # must stay lowercase for ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            docker build -t "${IMAGE}:${GITHUB_REF_NAME}" .
            docker push "${IMAGE}:${GITHUB_REF_NAME}"
          else
            docker build -t "${IMAGE}:latest" .
            docker push "${IMAGE}:latest"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          go-version-file: go.mod

      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o dolmen .
            tar -czf "dolmen_${GITHUB_REF_NAME}_linux_${arch}.tar.gz" dolmen
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${GITHUB_REF_NAME}" dolmen_*.tar.gz --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
