name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet -tags e2e ./...
      - run: go test ./...
      # e2e boots s3mock and Dex via testcontainers on the runner's Docker.
      - run: go test -tags e2e ./e2e/

  release:
    # Belt and braces beyond the push filter: only trunk moves :latest, only
    # tags create releases; workflow_dispatch runs tests without publishing.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tag builds create a GitHub Release
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }} # must stay lowercase for ghcr
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch in one build: the Dockerfile cross-compiles natively via
      # TARGETARCH.
      - name: Build and push image
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            docker buildx build --platform linux/amd64,linux/arm64 \
              --build-arg VERSION="${VERSION}" \
              -t "${IMAGE}:${GITHUB_REF_NAME}" --push .
          else
            docker buildx build --platform linux/amd64,linux/arm64 \
              --build-arg VERSION="${VERSION}" \
              -t "${IMAGE}:latest" --push .
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          go-version-file: go.mod

      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dolmen .
            tar -czf "dolmen_${GITHUB_REF_NAME}_linux_${arch}.tar.gz" \
              dolmen LICENSE README.md
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${GITHUB_REF_NAME}" dolmen_*.tar.gz --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Boots exactly what was just published against the same s3mock + Dex
  # versions the dev stack uses, and asserts the binary answers over HTTP.
  smoke:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same pinned stack as local dev (docker-compose.yaml). The app exits at
      # boot when Dex or S3 is unreachable, so wait for both to answer.
      - name: Start s3mock and Dex
        run: |
          docker compose up -d s3mock dex
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:9090/favicon.ico &&
              curl -sf -o /dev/null http://localhost:5556/dex/keys && break
            sleep 1
            [ "$i" = 60 ] && { docker compose logs; exit 1; }
          done

      - name: Log in to ghcr.io
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the published image
        env:
          IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        run: |
          docker pull "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"
          docker run -d --name smoke --network host \
            -v "$PWD/configs/example.yaml:/config/dolmen.yaml:ro" \
            -e OIDC_CLIENT_SECRET=secret \
            -e AWS_ACCESS_KEY_ID=test -e AWS_SECRET_ACCESS_KEY=test \
            "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break || sleep 1
            [ "$i" = 30 ] && { docker logs smoke; exit 1; }
          done

      - name: Assert the app answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          if [ "$code" != 302 ]; then
            docker logs smoke
            echo "GET / returned ${code}, want 302 to login"
            exit 1
          fi
          docker rm -f smoke
