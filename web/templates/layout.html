{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}}</title>
    <link rel="icon" href="{{asset "favicon.svg"}}" type="image/svg+xml">
    <link rel="stylesheet" href="{{asset "app.css"}}">
    <link rel="stylesheet" href="{{asset "chroma.css"}}">
</head>
<body>
    {{template "icons"}}
    <header class="site-head">
        <div class="container head-inner">
            <a class="brand" href="/"><svg class="brand-mark" viewBox="5.66 6.81 12.96 9.94" aria-hidden="true"><path fill="currentColor" d="M7.68 16.75V12.05L5.66 12.41L6.53 7.73L18.34 6.81L18.62 9.97L16.61 10.4V16.75H14.02V10.97L10.27 11.69V16.75Z"/></svg>Dolmen</a>
            <nav class="head-nav">
                <a class="btn btn-primary btn-sm" href="/"><svg class="i" aria-hidden="true"><use href="#i-add"/></svg>New gist</a>
                <a class="pill" href="/gists">My gists</a>
                <span class="user" title="Signed in as {{.Email}}"><span class="avatar">{{initial .Email}}</span>{{localpart .Email}}</span>
            </nav>
        </div>
    </header>
    <main class="container">
        {{template "content" .}}
    </main>
    <footer class="site-foot">
        <div class="container">Powered by <a href="https://github.com/brutasse/dolmen">Dolmen</a></div>
    </footer>
</body>
</html>{{end}}
