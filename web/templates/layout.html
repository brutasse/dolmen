{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{template "title" .}}</title>
    <script>
        /* Runs before the stylesheets so a manual choice never flashes the
           wrong palette; app.js owns the toggle, this only reads the stored
           value back. No key means follow the OS, which is what the
           color-scheme default in app.css does. try/catch because
           localStorage itself throws when storage is blocked. */
        try {
            var theme = localStorage.getItem("theme");
            if (theme === "light" || theme === "dark") {
                document.documentElement.dataset.theme = theme;
            }
        } catch (e) {}
    </script>
    <link rel="icon" href="{{asset "favicon.svg"}}" type="image/svg+xml">
    <link rel="stylesheet" href="{{asset "app.css"}}">
    <link rel="stylesheet" href="{{asset "chroma.css"}}">
</head>
<body>
    {{template "icons"}}
    <header class="site-head">
        <div class="container head-inner">
            <a class="brand" href="/"><svg class="brand-mark" viewBox="5.66 6.81 12.96 9.94" aria-hidden="true"><path fill="currentColor" d="M7.68 16.75V12.05L5.66 12.41L6.53 7.73L18.34 6.81L18.62 9.97L16.61 10.4V16.75H14.02V10.97L10.27 11.69V16.75Z"/></svg>Dolmen</a>
            <nav class="head-nav">
                <a class="btn btn-primary btn-sm" href="/"><svg class="i" aria-hidden="true"><use href="#i-add"/></svg>New gist</a>
                <a class="pill" href="/gists">My gists</a>
                <a class="pill" href="/gists/deleted">Deleted</a>
                <button type="button" class="btn btn-secondary btn-sm theme-toggle hidden" aria-label="Theme: system"><svg class="i" aria-hidden="true"><use href="#i-theme-auto"/></svg><span class="i-label">System</span></button>
                <span class="user" title="Signed in as {{.Email}}"><span class="avatar">{{initial .Email}}</span>{{localpart .Email}}</span>
            </nav>
        </div>
    </header>
    <main class="container">
        {{template "content" .}}
    </main>
    <footer class="site-foot">
        <div class="container">Powered by <a href="https://github.com/brutasse/dolmen">Dolmen</a></div>
    </footer>
</body>
</html>{{end}}
