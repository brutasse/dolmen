# Local development dependencies: s3mock (S3) and Dex (OIDC) with two static
# users — the same stack the e2e suite boots, with pinned image versions.
# See README for the matching app configs/example.yaml.
services:
  s3mock:
    image: adobe/s3mock:5.2.3
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: gists

  dex:
    image: dexidp/dex:v2.37.0
    command: ["dex", "serve", "/dex-config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./configs/dex-config.yaml:/dex-config.yaml:ro
