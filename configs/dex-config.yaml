# Dev-only Dex config for docker-compose.yaml: two static users
# (alice@example.com / bob@example.com, password "password", bcrypt hashes
# below), static client with a fixed secret, in-memory storage, no TLS.
# Do not reuse for production.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

logger:
  level: debug

staticClients:
  - id: gist-client
    name: Gist App
    secret: secret
    redirectURIs:
      - http://localhost:8080/callback

enablePasswordDB: true

staticPasswords:
  - email: alice@example.com
    hash: "$2b$10$jam9gTBW6gtVKuy.4N9UxOc1eVqCLQtYvGUDwCdbLNcllwRBlNN9u"
    username: alice
    userID: dev-alice
  - email: bob@example.com
    hash: "$2b$10$TJyXNIQZevinNB49.NfgOeacUHgKrpX4TwCSLmlhQZnWIerlXFPBm"
    username: bob
    userID: dev-bob
